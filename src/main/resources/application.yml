server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mebody-server
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Supabase 풀러(6543, transaction mode)는 서버측 prepared statement 를 재사용할 수 없다.
        # 끄지 않으면 요청이 몰릴 때 'prepared statement "S_n" already exists' 로 트랜잭션이 통째로 깨진다.
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 상품 사진 업로드. 기본값(1MB)이면 웬만한 제품 사진이 그대로 막힙니다.
      max-file-size: 8MB
      max-request-size: 12MB

mebody:
  frontend-origin: ${FRONTEND_ORIGIN:http://127.0.0.1:3000,http://localhost:3000}
  app-url: ${MEBODY_APP_URL:https://mebody-jjh.vercel.app}
  billing:
    # 개발용 결제 어댑터. 켜면 실제 결제 없이 멤버십이 켜지고 주문이 결제 완료가 됩니다.
    # 사업자등록·PG/스토어 계약 전에 플로우를 확인하려는 용도이며, 운영에서는 반드시 false 입니다.
    dev-mode: ${MEBODY_BILLING_DEV_MODE:false}
    subscription-days: ${MEBODY_BILLING_SUBSCRIPTION_DAYS:30}
    toss:
      secret-key: ${TOSS_SECRET_KEY:}
    google-play:
      package-name: ${GOOGLE_PLAY_PACKAGE_NAME:net.mebody.app}
      service-account-json: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:}
  auth:
    # 회원가입 확인 절차.
    #
    # 이메일: 2026-09-21 부터 ON. 가입하면 Supabase 가 확인 메일을 보내고, 링크를 열기 전에는
    #   로그인이 막힙니다. 되돌리려면 MEBODY_AUTH_REQUIRE_EMAIL_VERIFICATION=false 하나면 됩니다.
    #   ※ 전제: 확인 메일이 실제로 도착해야 합니다. Supabase 기본 SMTP 는 시간당 몇 통으로
    #     제한되고 프로젝트에 따라 팀 멤버 주소로만 나갑니다. 외부 가입자를 받기 전에
    #     Authentication → Emails 에서 자체 SMTP(Resend·SES 등)를 붙이세요.
    #     확인 링크가 돌아올 주소는 mebody.app-url 이고, 그 주소가 Supabase 의
    #     Redirect URLs 허용 목록에 있어야 합니다.
    #
    # 휴대폰: OFF. Supabase 전화 제공자가 꺼져 있어 인증 문자를 보낼 수단 자체가 없습니다.
    #   별칭 주소(01012345678@phone.mebody.net)는 받을 수 있는 메일함이 아니라서 이메일 확인도
    #   걸지 않습니다. SMS 제공자를 붙인 뒤에 켤 수 있습니다.
    require-email-verification: ${MEBODY_AUTH_REQUIRE_EMAIL_VERIFICATION:true}
    require-phone-verification: ${MEBODY_AUTH_REQUIRE_PHONE_VERIFICATION:false}
    # alias: 휴대폰 가입을 이메일 별칭(01012345678@phone.mebody.net)으로 처리 — 지금
    # native: 번호 자체로 가입·로그인 — Supabase 에 SMS 제공자를 연결한 뒤에만 동작합니다
    phone-mode: ${MEBODY_AUTH_PHONE_MODE:alias}
    # 앱의 VITE_PHONE_ALIAS_DOMAIN 과 같아야 합니다.
    phone-alias-domain: ${MEBODY_AUTH_PHONE_ALIAS_DOMAIN:phone.mebody.net}
    # 비밀번호 최소 길이. 우리 쪽 제한입니다.
    # 2026-09-22 감사까지 1(=제한 없음)이었습니다. 출시 기준으로 8 로 올렸습니다.
    # **가입과 재설정에만 걸립니다.** 로그인에는 걸지 않습니다 — 걸면 기준을 올린 순간
    # 기존 짧은 비밀번호 계정이 전부 잠깁니다. 그 사람들은 다음 재설정에서 새 기준을 맞춥니다.
    # 실제 하한은 Supabase 프로젝트 설정이 더 높으면 그쪽이 이깁니다(실측 시점 6자).
    # Supabase → Authentication → Policies 에서 바꿉니다.
    min-password-length: ${MEBODY_AUTH_MIN_PASSWORD_LENGTH:8}
    # 휴대폰 가입 허용 여부. 지금 휴대폰 가입은 SMS 인증이 아니라 이메일 별칭이라
    # **번호 소유를 증명하지 못합니다.** 남의 번호를 먼저 적어 선점하는 것을 막을 방법이 없습니다.
    # 공개 모집 전에 SMS 제공자를 붙이거나 이 값을 false 로 두세요.
    # false 로 두면 앱과 홈페이지가 설정을 읽어 휴대폰 안내를 함께 감춥니다.
    phone-signup-enabled: ${MEBODY_AUTH_PHONE_SIGNUP_ENABLED:true}
    # 휴대폰 가입에 복구용 이메일을 반드시 받을지. 별칭 주소(010…@phone.mebody.net)로는
    # 재설정 메일을 받을 수 없어서, 이게 없으면 비밀번호를 잊는 순간 계정을 되찾을 수 없습니다.
    require-phone-recovery-email: ${MEBODY_AUTH_REQUIRE_PHONE_RECOVERY_EMAIL:true}
  ads:
    # 보상형 광고 서버 검증(SSV). AdMob 콘솔의 광고 단위에 콜백 URL 을 등록한 뒤 켜세요.
    #   콜백 URL 예: https://<배포주소>/api/ads/admob/ssv
    # 꺼져 있으면 앱이 직접 보너스를 청구하는 기존 방식이 그대로 동작합니다.
    ssv-enabled: ${MEBODY_ADS_SSV_ENABLED:false}
    verifier-keys-url: ${MEBODY_ADS_VERIFIER_KEYS_URL:https://gstatic.com/admob/reward/verifier-keys.json}
    max-age-seconds: ${MEBODY_ADS_MAX_AGE_SECONDS:3600}
  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    jwks-url: ${SUPABASE_JWKS_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
