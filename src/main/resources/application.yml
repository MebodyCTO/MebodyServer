server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: mebody-server
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/postgres}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        # Supabase 풀러(6543, transaction mode)는 서버측 prepared statement 를 재사용할 수 없다.
        # 끄지 않으면 요청이 몰릴 때 'prepared statement "S_n" already exists' 로 트랜잭션이 통째로 깨진다.
        prepareThreshold: 0
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # 상품 사진 업로드. 기본값(1MB)이면 웬만한 제품 사진이 그대로 막힙니다.
      max-file-size: 8MB
      max-request-size: 12MB

mebody:
  frontend-origin: ${FRONTEND_ORIGIN:http://127.0.0.1:3000,http://localhost:3000}
  app-url: ${MEBODY_APP_URL:https://mebody-jjh.vercel.app}
  billing:
    # 개발용 결제 어댑터. 켜면 실제 결제 없이 멤버십이 켜지고 주문이 결제 완료가 됩니다.
    # 사업자등록·PG/스토어 계약 전에 플로우를 확인하려는 용도이며, 운영에서는 반드시 false 입니다.
    dev-mode: ${MEBODY_BILLING_DEV_MODE:false}
    subscription-days: ${MEBODY_BILLING_SUBSCRIPTION_DAYS:30}
    toss:
      secret-key: ${TOSS_SECRET_KEY:}
    google-play:
      package-name: ${GOOGLE_PLAY_PACKAGE_NAME:net.mebody.app}
      service-account-json: ${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:}
  auth:
    # 회원가입 확인 절차. 지금은 이메일·휴대폰 둘 다 가입 즉시 이용입니다.
    # 코드는 이미 들어 있고 아래 값만 true 로 바꾸면 확인 절차가 켜집니다.
    require-email-verification: ${MEBODY_AUTH_REQUIRE_EMAIL_VERIFICATION:false}
    require-phone-verification: ${MEBODY_AUTH_REQUIRE_PHONE_VERIFICATION:false}
    # alias: 휴대폰 가입을 이메일 별칭(01012345678@phone.mebody.net)으로 처리 — 지금
    # native: 번호 자체로 가입·로그인 — Supabase 에 SMS 제공자를 연결한 뒤에만 동작합니다
    phone-mode: ${MEBODY_AUTH_PHONE_MODE:alias}
    # 앱의 VITE_PHONE_ALIAS_DOMAIN 과 같아야 합니다.
    phone-alias-domain: ${MEBODY_AUTH_PHONE_ALIAS_DOMAIN:phone.mebody.net}
    # 비밀번호 최소 길이. 1 = 사실상 제한 없음(지금). 조건을 걸려면 8 등으로 올리세요.
    min-password-length: ${MEBODY_AUTH_MIN_PASSWORD_LENGTH:1}
  ads:
    # 보상형 광고 서버 검증(SSV). AdMob 콘솔의 광고 단위에 콜백 URL 을 등록한 뒤 켜세요.
    #   콜백 URL 예: https://<배포주소>/api/ads/admob/ssv
    # 꺼져 있으면 앱이 직접 보너스를 청구하는 기존 방식이 그대로 동작합니다.
    ssv-enabled: ${MEBODY_ADS_SSV_ENABLED:false}
    verifier-keys-url: ${MEBODY_ADS_VERIFIER_KEYS_URL:https://gstatic.com/admob/reward/verifier-keys.json}
    max-age-seconds: ${MEBODY_ADS_MAX_AGE_SECONDS:3600}
  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    jwt-secret: ${SUPABASE_JWT_SECRET:}
    jwks-url: ${SUPABASE_JWKS_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.springframework.security: INFO
